<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Reactor</title>
<meta name="description" content="You are the keeper bot. Tap in time, survive congestion, then install a rule and watch the chain react by itself. A fan made game about Rialo's reactive transactions.">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" onload="this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"></noscript>
<style>
:root { --ink: #0a0a0a; --slab: #141619; --rail: #2a2e34; --paper: #e8e3d5; --mute: #8d8a82; --glacier: #9fd3e8; --amber: #f2b84b; --signal: #ff5c5c; --moss: #9bd49a; --ui: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; --mono: 'JetBrains Mono', Menlo, Consolas, monospace; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--ink); color: var(--paper); font-family: var(--ui); height: 100%; overscroll-behavior: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible { outline: 2px solid var(--glacier); outline-offset: 2px; }
a { color: var(--glacier); text-decoration: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px; border-radius: 6px; border: 1px solid var(--rail); background: #1b1e22; font-weight: 600; }
.btn.primary { background: var(--paper); color: var(--ink); border-color: var(--paper); }
.btn.quiet { border-color: transparent; color: var(--mute); }
.btn:disabled { opacity: 0.4; cursor: default; }
#app { height: 100%; display: flex; flex-direction: column; align-items: center; }
.frame { width: 100%; max-width: 480px; height: 100%; display: flex; flex-direction: column; position: relative; }
.hud { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; padding: 10px 12px 6px; font-family: var(--mono); font-size: 13px; }
.hud div { display: flex; flex-direction: column; gap: 1px; }
.hud span { color: var(--mute); font-family: var(--ui); font-size: 11px; }
.hud b { font-weight: 600; font-size: 16px; }
.hud .combo b { color: var(--amber); }
canvas { display: block; width: 100%; flex: 1; min-height: 0; touch-action: none; }
.rules { display: grid; gap: 6px; padding: 8px 12px calc(12px + env(safe-area-inset-bottom)); }
.rules .h { font-size: 11px; color: var(--mute); }
.rule { display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; align-items: center; text-align: left; padding: 9px 12px; border: 1px solid var(--rail); border-radius: 6px; font-family: var(--mono); font-size: 13px; color: var(--mute); }
.rule .dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--rail); }
.rule.ready { color: var(--paper); border-color: var(--glacier); }
.rule.ready .dot { background: var(--glacier); border-color: var(--glacier); box-shadow: 0 0 0 4px rgba(159,211,232,0.18); animation: pulse 1.1s ease-in-out infinite; }
.rule.on { color: var(--glacier); border-color: var(--glacier); background: rgba(159,211,232,0.1); }
.rule.on .dot { background: var(--glacier); border-color: var(--glacier); }
.rule .cost { font-size: 12px; }
@keyframes pulse { 50% { box-shadow: 0 0 0 1px rgba(159,211,232,0.1); } }
.ov { position: absolute; inset: 0; background: rgba(10,10,10,0.86); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 5; }
.ov .pane { width: 100%; max-width: 420px; display: grid; gap: 14px; }
.pane h1 { font-size: 30px; line-height: 1.05; margin: 0; letter-spacing: -0.02em; }
.pane h2 { font-size: 22px; margin: 0; }
.pane p { margin: 0; color: var(--mute); font-size: 15px; line-height: 1.45; }
.pane .you { color: var(--paper); border-left: 2px solid var(--glacier); padding-left: 12px; }
.pane .row { display: flex; gap: 8px; flex-wrap: wrap; }
.pane .src { font-size: 12px; color: var(--mute); }
.stars { font-family: var(--mono); font-size: 26px; letter-spacing: 0.12em; color: var(--amber); }
.goals { display: grid; gap: 8px; }
.goal { display: grid; grid-template-columns: 20px 1fr; gap: 10px; font-size: 14px; }
.goal .i { font-family: var(--mono); color: var(--mute); } .goal.ok .i { color: var(--moss); } .goal.bad .i { color: var(--signal); }
.stats { font-family: var(--mono); font-size: 13px; color: var(--mute); display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
.stats b { color: var(--paper); font-weight: 500; }
.lesson { border: 1px solid var(--rail); padding: 10px 12px; font-size: 14px; color: var(--paper); }
.lesson b { color: var(--glacier); }
.lang { position: absolute; top: 8px; right: 8px; z-index: 6; font-family: var(--mono); font-size: 12px; color: var(--mute); padding: 6px 8px; }
.toast { position: absolute; left: 50%; top: 72px; transform: translateX(-50%); background: var(--paper); color: var(--ink); padding: 6px 12px; border-radius: 6px; font-size: 13px; z-index: 7; pointer-events: none; animation: toast 1.4s forwards; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 6px); } 15% { opacity: 1; transform: translate(-50%, 0); } 80% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .rule.ready .dot { animation: none; } }
</style>
</head>
<body>
<div id="app"><div class="frame">
  <button class="lang" id="langBtn">TR</button>
  <div class="hud">
    <div><span data-t="block">block</span><b id="hBlock">0</b></div>
    <div><span data-t="score">score</span><b id="hScore">0</b></div>
    <div><span data-t="credits">credits</span><b id="hCredits">0</b></div>
    <div class="combo"><span data-t="combo">combo</span><b id="hCombo">×1</b></div>
  </div>
  <canvas id="cv"></canvas>
  <div class="rules" id="rules"></div>

  <div class="ov" id="intro">
    <div class="pane">
      <h1 id="iTitle"></h1>
      <p class="you" id="iIntro"></p>
      <p data-t="how">Tap a card to send the transaction. Tap early when the network is busy: a sent transaction takes blocks to land. Do not tap decoys, they get rejected and cost gas. Every landed transaction pays credits; spend them on a rule and the chain handles that event by itself.</p>
      <div class="src" id="iSrc"></div>
      <div class="row"><button class="btn primary" id="startBtn" data-t="start">Start</button></div>
    </div>
  </div>

  <div class="ov" id="result" hidden>
    <div class="pane">
      <h2 id="rTitle"></h2>
      <div class="stars" id="rStars"></div>
      <div class="goals" id="rGoals"></div>
      <div class="stats" id="rStats"></div>
      <div class="lesson" id="rLesson"></div>
      <div class="row"><button class="btn primary" id="againBtn" data-t="again">Play again</button><button class="btn" id="shareBtn" data-t="share">Share on X</button></div>
    </div>
  </div>
</div></div>

<script>
/*__CORE__*/
</script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const A = window.RXA;
let LANG = 'en'; try { const saved = localStorage.getItem('rx_lang'); LANG = saved || ((navigator.language || '').toLowerCase().startsWith('tr') ? 'tr' : 'en'); } catch (e) {}
const TR = {
  block: 'blok', score: 'skor', credits: 'kredi', combo: 'seri', start: 'Başla', again: 'Tekrar oyna', share: "X'te paylaş",
  how: 'İşlemi göndermek için karta dokun. Ağ yoğunken erken dokun: gönderilen işlemin yerleşmesi bloklar sürer. Tuzak kartlara dokunma, reddedilir ve gas yakar. Yerleşen her işlem kredi kazandırır; krediyle bir kural kur, o olayı artık zincir kendisi halleder.',
  'Night shift': 'Gece vardiyası',
  'You are the keeper bot tonight. Rewards pile up, a presale opens at block 12, and the network gets busy right then. Tap a card to send the transaction. Decoys are traps. Earn credits and install a rule: the chain then handles that event by itself.': "Bu gece keeper botu sensin. Ödüller birikiyor, 12. blokta bir ön satış açılıyor ve tam o sırada ağ yoğunlaşıyor. İşlem göndermek için karta dokun. Tuzak kartlar var. Kredi biriktir ve bir kural kur: o olayı artık zincir kendisi halleder.",
  'Rewards ready: {v} RLO': 'Ödül hazır: {v} RLO', Claim: 'Al', 'Rewards: {v} RLO, under 6': 'Ödül: {v} RLO, 6\'dan az', 'nothing worth claiming yet': 'henüz almaya değer ödül yok',
  'Presale is open': 'Ön satış açıldı', 'Buy 100 tokens': '100 token al', 'Presale opens soon': 'Ön satış yakında', 'the presale is not open': 'ön satış açık değil',
  'When rewards reach 6 RLO, claim': 'Ödül 6 RLO olunca al', 'When the presale opens, buy 100': 'Ön satış açılınca 100 al',
  'Buy into the presale while it is open': 'Ön satış açıkken alım yap', 'Miss no reward and tap no decoy': 'Hiçbir ödülü kaçırma, hiçbir tuzağa dokunma', 'Install at least one rule and let the chain react': 'En az bir kural kur ve zincirin tepki vermesine izin ver',
  'Congestion: transactions take {n} blocks to land': 'Yoğunluk: işlemler {n} blokta yerleşiyor', 'tap': 'dokun', 'sent': 'gönderildi', 'landed': 'yerleşti', 'the chain reacted': 'zincir tepki verdi', 'missed': 'kaçtı', 'too late': 'geç kaldı', 'rejected': 'reddedildi', 'ignored by the rule': 'kural yok saydı',
  'wait': 'bekle', 'rule installed': 'kural kuruldu', 'Rules': 'Kurallar', 'Rules: earn credits, then install': 'Kurallar: kredi biriktir, sonra kur', 'installed': 'kurulu', '{c} credits': '{c} kredi',
  'The chain reacted': 'Zincir tepki verdi', 'The night is over': 'Gece bitti', 'landed by you': 'senin yerleştirdiğin', 'handled by the chain': 'zincirin hallettiği', 'missed': 'kaçan', 'rejected taps': 'reddedilen dokunuş', 'best combo': 'en iyi seri', 'score': 'skor',
  'Every card you tapped tonight was a predicate someone had to watch for. On Rialo that watching is a rule the chain evaluates at the end of every block: no bot, no 3 AM alarm. Install both rules next time and see how quiet the night gets.': 'Bu gece dokunduğun her kart, birinin beklemesi gereken bir koşuldu. Rialo\'da o bekleyiş, zincirin her blok sonunda değerlendirdiği bir kural: bot yok, sabah 3 alarmı yok. Bir dahaki sefere iki kuralı da kur, gecenin ne kadar sakinleştiğini gör.',
  'You installed <b>{n}</b> rule(s) and the chain handled <b>{a}</b> events by itself, in congestion too. That is a reactive transaction: a predicate the chain evaluates at the end of every block. The rest you still had to catch by hand.': 'Zincir <b>{n}</b> kuralla <b>{a}</b> olayı kendi halletti, yoğunlukta bile. Reaktif işlem tam olarak bu: zincirin her blok sonunda değerlendirdiği bir koşul. Kalanını hâlâ elle yakalamak zorundaydın.',
  'From': 'Kaynak',
};
const tr = (s, v) => { let t = LANG === 'tr' && TR[s] != null ? TR[s] : s; if (v) for (const k in v) t = t.split('{' + k + '}').join(v[k]); return t; };
function applyLang() { document.documentElement.lang = LANG; for (const el of document.querySelectorAll('[data-t]')) { if (el.dataset.en == null) el.dataset.en = el.innerHTML; el.innerHTML = LANG === 'tr' ? (TR[el.dataset.t] != null ? TR[el.dataset.t] : el.dataset.en) : el.dataset.en; } $('langBtn').textContent = LANG === 'tr' ? 'EN' : 'TR'; }
$('langBtn').onclick = () => { LANG = LANG === 'tr' ? 'en' : 'tr'; try { localStorage.setItem('rx_lang', LANG); } catch (e) {} applyLang(); renderIntro(); renderRules(); if (run && run.done) showResult(); };

// ---------- state ----------
const level = A.LEVELS[0];
let run = null, startedAt = 0, pausedAt = null, raf = 0, lastT = 0;
const cv = $('cv'), ctx = cv.getContext('2d');
const W = 420; let H = 620, DPR = 1, rects = [];
const fx = []; // visual effects: { kind, x, y, t0, text, color }
function fit() { const r = cv.getBoundingClientRect(); DPR = Math.min(2, window.devicePixelRatio || 1); H = Math.max(360, Math.round(r.height * W / r.width)); cv.width = W * DPR; cv.height = H * DPR; }
window.addEventListener('resize', fit);

function renderIntro() { $('iTitle').textContent = tr(level.name); $('iIntro').textContent = tr(level.intro); $('iSrc').innerHTML = tr('From') + ': <a href="' + level.src.url + '" target="_blank" rel="noopener">' + level.src.label + '</a>'; }
function start() {
  run = A.newRun(level); fx.length = 0; startedAt = performance.now(); lastT = 0; pausedAt = null;
  $('intro').hidden = true; $('result').hidden = true; renderRules(); fit();
  cancelAnimationFrame(raf); raf = requestAnimationFrame(frame);
}
$('startBtn').onclick = start; $('againBtn').onclick = () => { $('result').hidden = true; renderIntro(); $('intro').hidden = false; };
document.addEventListener('visibilitychange', () => { if (!run || run.done) return; if (document.hidden) pausedAt = performance.now(); else if (pausedAt != null) { startedAt += performance.now() - pausedAt; pausedAt = null; } });

// ---------- rules row ----------
function renderRules() {
  const box = $('rules'); box.innerHTML = `<div class="h">${tr(run && Object.keys(run.installed).length ? 'Rules' : 'Rules: earn credits, then install')}</div>`;
  for (const r of level.rules) {
    const on = run && run.installed[r.type], ready = run && !on && run.credits >= r.cost;
    const b = document.createElement('button'); b.className = 'rule' + (on ? ' on' : ready ? ' ready' : ''); b.disabled = !run || run.done || !!on || !ready;
    b.innerHTML = `<span class="dot"></span><span>${tr(r.label)}</span><span class="cost">${on ? tr('installed') : tr('{c} credits', { c: r.cost })}</span>`;
    b.onclick = () => { if (A.install(run, r.id)) { toast(tr('rule installed')); renderRules(); } };
    box.appendChild(b);
  }
}
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.querySelector('.frame').appendChild(d); setTimeout(() => d.remove(), 1500); }

// ---------- input ----------
cv.addEventListener('pointerdown', (e) => {
  if (!run || run.done) return;
  const r = cv.getBoundingClientRect(); const x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * W / r.width;
  for (const rc of rects) if (x >= rc.x && x <= rc.x + rc.w && y >= rc.y && y <= rc.y + rc.h) {
    const res = A.tap(run, rc.id); const c = run.cards.find(k => k.id === rc.id);
    if (res === 'sent') fx.push({ kind: 'ring', x: rc.x + rc.w / 2, y: rc.y + rc.h / 2, t0: run.t, color: '#e8e3d5' });
    if (res === 'rejected') { fx.push({ kind: 'text', x: rc.x + rc.w / 2, y: rc.y, t0: run.t, text: tr('rejected') + ': ' + tr(level.types[c.type].decoyWhy), color: '#ff5c5c' }); shake = 0.3; }
    return;
  }
});
let shake = 0;

// ---------- drawing ----------
const LANE_X = 54, CARD_X = 76, CARD_W = W - CARD_X - 16, TOP = 24, LINE = () => H - 64;
function frame(now) {
  if (!run) return;
  if (pausedAt == null) {
    const t = (now - startedAt) / level.blockMs;
    const before = { landed: run.landed, missed: run.missed, automated: run.automated, credits: run.credits };
    A.advance(run, t);
    // effects for state changes
    for (const c of run.cards) {
      if (c.resolvedAt != null && c.resolvedAt > lastT && c.resolvedAt <= run.t) {
        const pos = cardPos(c, c.resolvedAt);
        if (c.status === 'landed') fx.push({ kind: 'text', x: CARD_X + CARD_W / 2, y: pos.y, t0: c.resolvedAt, text: (c.auto ? tr('the chain reacted') : tr('landed')) + '  +' + run.log.filter(l => l.card === c.id && (l.kind === 'landed' || l.kind === 'auto')).map(l => l.gain)[0], color: c.auto ? '#9fd3e8' : '#9bd49a' });
        if (c.status === 'missed' || c.status === 'late') { fx.push({ kind: 'text', x: CARD_X + CARD_W / 2, y: pos.y, t0: c.resolvedAt, text: tr(c.status === 'late' ? 'too late' : 'missed'), color: '#ff5c5c' }); shake = 0.4; }
        if (c.status === 'ignored') fx.push({ kind: 'text', x: CARD_X + CARD_W / 2, y: pos.y, t0: c.resolvedAt, text: tr('ignored by the rule'), color: '#9fd3e8' });
      }
    }
    if (run.credits !== before.credits || run.landed !== before.landed) renderRules();
    lastT = run.t;
  }
  draw(); updateHud();
  if (run.done) { setTimeout(showResult, 700); return; }
  raf = requestAnimationFrame(frame);
}
function cardPos(c, t) { const p = Math.min(1, Math.max(0, (t - c.at) / c.window)); const y = TOP + 36 + p * (LINE() - TOP - 36 - 70); return { y }; }
function draw() {
  const t = run.t; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H);
  if (shake > 0) { shake = Math.max(0, shake - 0.02); ctx.translate((Math.random() - 0.5) * shake * 10, (Math.random() - 0.5) * shake * 10); }
  const busy = A.congested(run, t);
  // lane
  ctx.fillStyle = busy ? 'rgba(255,92,92,0.10)' : 'rgba(232,227,213,0.03)'; ctx.fillRect(0, 0, LANE_X, H);
  ctx.strokeStyle = '#2a2e34'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(LANE_X, 0); ctx.lineTo(LANE_X, H); ctx.stroke();
  // blocks on the lane: block n sits at y for its time; the lane scrolls so that "now" is near the deadline line
  const pxPerBlock = 44; const yOf = (b) => LINE() - (b - t) * pxPerBlock;
  ctx.font = '600 12px JetBrains Mono, monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let b = Math.max(0, Math.floor(t) - 12); b <= Math.min(level.blocks, Math.floor(t) + 14); b++) {
    const y = yOf(b); if (y < -20 || y > H + 20) continue;
    const isNow = b === Math.floor(t);
    const cong = level.congestion.some(([a, z]) => b >= a && b < z);
    if (cong) { ctx.fillStyle = 'rgba(255,92,92,0.16)'; ctx.fillRect(0, y - pxPerBlock / 2, LANE_X, pxPerBlock); }
    ctx.fillStyle = isNow ? '#e8e3d5' : b < t ? '#5f5d57' : '#8d8a82';
    if (isNow) { ctx.fillStyle = '#e8e3d5'; ctx.fillRect(6, y - 12, LANE_X - 12, 24); ctx.fillStyle = '#0a0a0a'; }
    ctx.fillText(String(b), LANE_X / 2, y);
  }
  // deadline line
  ctx.strokeStyle = busy ? 'rgba(255,92,92,0.6)' : 'rgba(232,227,213,0.35)'; ctx.setLineDash([6, 6]); ctx.beginPath(); ctx.moveTo(LANE_X, LINE()); ctx.lineTo(W, LINE()); ctx.stroke(); ctx.setLineDash([]);
  ctx.textAlign = 'left'; ctx.font = '500 11px JetBrains Mono, monospace'; ctx.fillStyle = busy ? '#ff5c5c' : '#8d8a82';
  ctx.fillText(busy ? tr('Congestion: transactions take {n} blocks to land', { n: level.congestedLatency }) : tr('deadline'), CARD_X, LINE() + 16);
  // cards
  rects = [];
  const active = run.cards.filter(c => c.status === 'active' || c.status === 'sent' || (c.resolvedAt != null && t - c.resolvedAt < 0.5));
  for (const c of active) {
    const T = level.types[c.type]; const pos = cardPos(c, Math.min(t, c.resolvedAt != null ? c.resolvedAt : t));
    const h = 54, x = CARD_X, y = pos.y - h / 2, w = CARD_W;
    const gone = c.resolvedAt != null ? Math.min(1, (t - c.resolvedAt) / 0.5) : 0;
    ctx.save(); ctx.globalAlpha = 1 - gone;
    if (c.status === 'landed' && c.auto) { ctx.fillStyle = 'rgba(159,211,232,0.18)'; ctx.strokeStyle = '#9fd3e8'; }
    else if (c.status === 'landed') { ctx.fillStyle = 'rgba(155,212,154,0.14)'; ctx.strokeStyle = '#9bd49a'; }
    else if (c.status === 'missed' || c.status === 'late' || c.status === 'rejected') { ctx.fillStyle = 'rgba(255,92,92,0.14)'; ctx.strokeStyle = '#ff5c5c'; }
    else if (c.status === 'sent') { ctx.fillStyle = '#1b1e22'; ctx.strokeStyle = '#8d8a82'; }
    else { ctx.fillStyle = '#141619'; ctx.strokeStyle = c.decoy ? '#3a3f47' : T.color; }
    rr(x, y, w, h, 8); ctx.fill(); ctx.lineWidth = c.status === 'active' && !c.decoy ? 1.5 : 1; ctx.stroke();
    // text
    ctx.fillStyle = c.decoy ? '#8d8a82' : '#e8e3d5'; ctx.font = '600 14px Space Grotesk, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    const label = tr(c.decoy ? T.decoyLabel : T.label, { v: c.v }); ctx.fillText(label, x + 12, y + 18);
    ctx.font = '500 12px JetBrains Mono, monospace'; ctx.fillStyle = c.decoy ? '#5f5d57' : T.color;
    ctx.fillText(c.status === 'sent' ? tr('sent') + ' · ' + tr('landed') + ' @' + Math.ceil(c.landAt) : tr(c.decoy ? 'wait' : T.action), x + 12, y + 38);
    // time bar: how much window is left
    if (c.status === 'active') { const left = 1 - (t - c.at) / c.window; ctx.fillStyle = 'rgba(232,227,213,0.12)'; ctx.fillRect(x + w - 60, y + 14, 48, 4); ctx.fillStyle = left < 0.3 ? '#ff5c5c' : T.color; ctx.fillRect(x + w - 60, y + 14, 48 * Math.max(0, left), 4); if (run.installed[c.type]) { ctx.fillStyle = '#9fd3e8'; ctx.font = '600 10px JetBrains Mono, monospace'; ctx.textAlign = 'right'; ctx.fillText(tr('rule'), x + w - 12, y + 38); } else { ctx.fillStyle = '#8d8a82'; ctx.font = '600 10px JetBrains Mono, monospace'; ctx.textAlign = 'right'; ctx.fillText(c.decoy ? '' : tr('tap').toUpperCase(), x + w - 12, y + 38); } }
    if (c.status === 'sent') { const p = Math.min(1, (t - c.sentAt) / (c.landAt - c.sentAt)); ctx.fillStyle = 'rgba(232,227,213,0.12)'; ctx.fillRect(x + w - 60, y + 14, 48, 4); ctx.fillStyle = c.landAt > A.deadline(c) ? '#ff5c5c' : '#e8e3d5'; ctx.fillRect(x + w - 60, y + 14, 48 * p, 4); }
    ctx.restore();
    if (c.status === 'active') rects.push({ id: c.id, x, y, w, h });
  }
  // effects
  for (let i = fx.length - 1; i >= 0; i--) { const f = fx[i]; const age = t - f.t0; if (age > 1) { fx.splice(i, 1); continue; } ctx.save(); ctx.globalAlpha = 1 - age; if (f.kind === 'ring') { ctx.strokeStyle = f.color; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(f.x, f.y, 10 + age * 60, 0, 7); ctx.stroke(); } else { ctx.fillStyle = f.color; ctx.font = '700 13px Space Grotesk, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(f.text, f.x, f.y - 30 - age * 30); } ctx.restore(); }
  // chain flash on automated reactions
  const lastAuto = run.log.filter(l => l.kind === 'auto').pop(); if (lastAuto && t - lastAuto.t < 0.6) { ctx.strokeStyle = `rgba(159,211,232,${0.9 * (1 - (t - lastAuto.t) / 0.6)})`; ctx.lineWidth = 3; ctx.strokeRect(1.5, 1.5, W - 3, H - 3); }
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function updateHud() { $('hBlock').textContent = Math.min(level.blocks, Math.floor(run.t)) + ' / ' + level.blocks; $('hScore').textContent = run.score.toLocaleString('en-US'); $('hCredits').textContent = run.credits; $('hCombo').textContent = '×' + Math.max(1, run.combo); }

// ---------- result ----------
function showResult() {
  if (!run || !run.done) return;
  $('rTitle').textContent = tr(run.automated > 0 ? 'The chain reacted' : 'The night is over'); $('rStars').textContent = '★'.repeat(run.stars) + '☆'.repeat(3 - run.stars);
  $('rGoals').innerHTML = run.goals.map(g => `<div class="goal ${g.ok ? 'ok' : 'bad'}"><span class="i">${g.ok ? '✓' : '✗'}</span><span>${tr(g.text)}</span></div>`).join('');
  const manual = run.landed - run.automated;
  $('rStats').innerHTML = `<span>${tr('landed by you')} <b>${manual}</b></span><span>${tr('handled by the chain')} <b>${run.automated}</b></span><span>${tr('missed')} <b>${run.missed}</b></span><span>${tr('rejected taps')} <b>${run.rejected}</b></span><span>${tr('best combo')} <b>×${Math.max(1, run.maxCombo)}</b></span><span>${tr('score')} <b>${run.score.toLocaleString('en-US')}</b></span>`;
  const n = Object.keys(run.installed).length;
  $('rLesson').innerHTML = n ? tr('You installed <b>{n}</b> rule(s) and the chain handled <b>{a}</b> events by itself, in congestion too. That is a reactive transaction: a predicate the chain evaluates at the end of every block. The rest you still had to catch by hand.', { n, a: run.automated }) : tr('Every card you tapped tonight was a predicate someone had to watch for. On Rialo that watching is a rule the chain evaluates at the end of every block: no bot, no 3 AM alarm. Install both rules next time and see how quiet the night gets.');
  $('result').hidden = false;
  $('shareBtn').onclick = () => { const text = `Reactor, night shift: ${run.score} points, ${run.automated} events handled by the chain itself, ${run.missed} missed. You are the keeper bot until you install a rule. A fan made game about @RialoHQ's reactive transactions.`; window.open('https://x.com/intent/post?text=' + encodeURIComponent(text + '\n' + location.origin + location.pathname), '_blank', 'noopener'); };
}

applyLang(); renderIntro(); renderRules(); fit();
window.__rxa = { get run() { return run; }, start, A, level, rects: () => rects, advanceTo: (t) => { startedAt = performance.now() - t * level.blockMs; } };
</script>
